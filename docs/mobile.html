<script>
/* téléphone : avatar de la couverture et étiquettes « à propos » (textes partagés avec la bonbonnière) */
(function () {
  var t = setInterval(function () {
    var av = document.getElementById('m-av'), notes = document.getElementById('m-notes');
    if (!av || !notes || !window.AVATAR || !window.PF_ETIQUETTES) return;
    clearInterval(t);
    if (window.__avFull) av.innerHTML = window.__avFull('wink');
    // arrivée depuis une page de l'ordinateur (curiosités, à propos…) : on va directement à la bonne partie
    var cible = location.hash && document.getElementById(location.hash.slice(1)), sc = document.querySelector('.scroller');
    if (cible && sc) setTimeout(function () { sc.scrollTop = Math.max(0, cible.offsetTop - 70); }, 400);
    var COL = ['#FF5B4D', '#3472F6', '#36A96B', '#F21BC9', '#FFB92F'];
    notes.innerHTML = window.PF_ETIQUETTES.map(function (o, i) {
      return '<div class="mnote" style="--c: ' + COL[i % 5] + '; --r: ' + (i % 2 ? 1.5 : -1.5) + 'deg"><span class="mtape"></span>'
        + '<span class="mic">' + window.AVATAR.avatar(o.e) + '</span><h3>' + o.t + '</h3><p>' + o.x + '</p></div>';
    }).join('');
  }, 150);
})();
</script>
