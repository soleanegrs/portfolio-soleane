.intro3{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;z-index:70}
.intro3 .cream{position:absolute;left:0;top:0;width:100%;height:100%;background:#F5F0E7}
.bshadow{position:absolute;left:50%;top:50%;width:300px;height:40px;margin:150px 0 0 -150px;border-radius:50%;background:radial-gradient(closest-side,rgba(60,50,40,.28),rgba(60,50,40,0))}
.bw3{position:relative;width:540px;height:540px}
.drift3{width:100%;height:100%}
.sprite3{display:block;width:540px;height:540px;background-image:url(assets/boule.webp);background-size:3240px 2700px;background-repeat:no-repeat;background-position:0 0;filter:drop-shadow(0 18px 22px rgba(60,50,40,.22))}

.intro3.idle .plain:hover .drift3{animation:wob .9s ease-in-out infinite}
.intro3.open .sprite3{animation:unf2 3.3s step-end forwards}
.intro3.open .drift3{animation:drift 3.3s ease-in-out forwards}
.intro3.open .bshadow{animation:fadeout .8s ease forwards}
.intro3.open .bw3{animation:grow3 1.1s cubic-bezier(.6,0,.25,1) 3.25s forwards}
.intro3.open .cream{animation:fadeout .2s linear 4.3s forwards}
.intro3.open{animation:fadeout .45s ease 4.3s forwards;pointer-events:none}
.intro3.closing{animation:fadein .4s ease both}
.intro3.closing .bw3{animation:shrink3 1.1s cubic-bezier(.3,0,.25,1) .2s both}
.intro3.closing .sprite3{animation:unf2 3.3s step-end 1.3s reverse both}
.intro3.closing .drift3{animation:drift 3.3s ease-in-out 1.3s reverse both}
.intro3.closing .bshadow{animation:fadein .8s ease 4.2s both}

(function () {

  }
